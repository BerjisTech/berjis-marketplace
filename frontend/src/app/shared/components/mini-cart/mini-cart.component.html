<div class="relative" *ngIf="open">
  <div class="absolute right-0 mt-2 w-[340px] rounded-xl border border-blue-900/20 dark:border-slate-700 bg-white dark:bg-slate-950 shadow-brand p-3 z-50">
    <div class="flex items-center justify-between mb-2">
      <div class="text-sm font-semibold">Your Cart</div>
      <button class="text-sm" (click)="close()">Close</button>
    </div>
    <div *ngIf="items().length===0" class="text-sm text-slate-600 dark:text-slate-300">
      Cart is empty.
    </div>
    <div *ngIf="items().length>0" class="max-h-64 overflow-y-auto flex flex-col gap-2">
      <div *ngFor="let it of items(); let i = index" class="flex items-center gap-2 border rounded-lg p-2">
        <div class="w-12 h-12 rounded bg-blue-100 dark:bg-slate-900 overflow-hidden">
          <img *ngIf="it.imageUrl" [src]="it.imageUrl" class="w-full h-full object-cover" [attr.alt]="it.title || 'Product image'" />
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate">{{ it.title }}</div>
          <div class="text-xs text-slate-500">{{ (it.priceCents/100) | number:'1.2-2' }} {{ it.currency }}</div>
          <div class="inline-flex items-center border rounded-full mt-1 overflow-hidden">
            <button class="w-6 h-6 grid place-items-center" (click)="dec(i)">-</button>
            <div class="w-8 text-center text-xs">{{ it.quantity }}</div>
            <button class="w-6 h-6 grid place-items-center" (click)="inc(i)">+</button>
          </div>
        </div>
        <button class="text-xs text-red-600" (click)="remove(i)">Remove</button>
      </div>
    </div>
    <div class="mt-3 flex items-center justify-between text-sm">
      <div>Subtotal</div>
      <div>{{ (subtotalCents()/100) | number:'1.2-2' }} {{ items()[0]?.currency }}</div>
    </div>
    <div class="mt-2 grid grid-cols-2 gap-2">
      <a routerLink="/cart" class="rounded-full h-9 grid place-items-center border">View cart</a>
      <a routerLink="/checkout" class="rounded-full h-9 grid place-items-center btn btn-primary">Checkout</a>
    </div>
  </div>
</div>
