<div class="py-4 space-y-6 max-w-2xl">
  <h1 class="text-xl font-semibold text-blue-900 dark:text-white">Notifications</h1>
  <p class="text-sm text-slate-600 dark:text-slate-300">Configure email notification preferences.</p>

  @if (error()) {
    <p class="text-sm text-red-500">{{ error() }}</p>
  }
  @if (saved()) {
    <p class="text-sm text-green-600 dark:text-green-400">Notification settings saved.</p>
  }

  @if (loading()) {
    <div class="space-y-4">
      @for (i of [1,2,3,4]; track i) {
        <div class="h-16 animate-pulse rounded-lg bg-slate-200 dark:bg-slate-800"></div>
      }
    </div>
  } @else {
    <div class="space-y-3">
      @for (notification of notifications(); track notification.id) {
        <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-4">
          <div class="flex items-center justify-between gap-4">
            <label class="flex items-center gap-3 cursor-pointer flex-1">
              <input type="checkbox" [checked]="notification.enabled" (change)="toggleNotification(notification.id)"
                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              <div>
                <span class="text-sm font-medium text-slate-700 dark:text-slate-300">{{ notification.label }}</span>
                <p class="text-xs text-slate-500 dark:text-slate-400">{{ notification.description }}</p>
              </div>
            </label>
            <button type="button" (click)="sendTest(notification.id)"
              [disabled]="testSending() === notification.id"
              class="shrink-0 rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 transition">
              {{ testSending() === notification.id ? 'Sending...' : 'Send test' }}
            </button>
          </div>
        </div>
      }
    </div>

    <button type="button" (click)="save()" [disabled]="saving()"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-500 disabled:opacity-50 transition">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
  }
</div>
