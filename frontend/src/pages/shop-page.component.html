<div class="min-h-screen px-[clamp(1rem,6vw,3rem)] py-10 text-[color:var(--color-text-primary)] dark:text-[color:var(--color-text-dark)]">
  <a routerLink="/" class="text-sm">← Back to marketplace</a>
  <h1 class="mt-4 text-2xl font-bold text-blue-900 dark:text-white">{{ shop()?.name }}</h1>
  <p class="text-slate-600 dark:text-slate-300 mb-6">{{ '@' + (shop()?.slug || '') }}</p>
  <div class="grid grid-cols-[repeat(auto-fill,minmax(240px,1fr))] gap-6">
    <article *ngFor="let p of products()" class="rounded-xl border border-blue-900/20 dark:border-slate-800 bg-white/80 dark:bg-slate-950/70 p-4">
      <div class="aspect-[4/3] rounded-lg bg-blue-100 dark:bg-slate-900 mb-3 overflow-hidden">
        <img *ngIf="p.imageUrl" [src]="p.imageUrl" alt="" class="w-full h-full object-cover"/>
      </div>
      <h3 class="text-base font-semibold text-blue-900 dark:text-white">{{ p.title }}</h3>
      <div class="mt-2 text-sm text-slate-700 dark:text-slate-200">{{ (p.priceCents/100) | number:'1.2-2' }} {{ p.currency }}</div>
    </article>
  </div>
</div>
