<div class="py-4">
  <h1 class="text-xl font-semibold text-blue-900 dark:text-white mb-2">Settings</h1>
  <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">Configure your store preferences, payments, and policies.</p>
  <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
    @for (s of sections; track s.route) {
      <a [routerLink]="s.route"
        class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 hover:border-blue-400 dark:hover:border-blue-600 transition group">
        <p class="text-sm font-medium text-blue-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-300">{{ s.label }}</p>
        <p class="text-xs text-slate-500 mt-0.5">{{ s.desc }}</p>
      </a>
    }
  </div>
</div>
