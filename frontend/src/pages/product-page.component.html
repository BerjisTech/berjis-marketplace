<div class="min-h-screen px-[clamp(1rem,6vw,3rem)] py-10 text-[color:var(--color-text-primary)] dark:text-[color:var(--color-text-dark)]">
  <ng-container *ngIf="!loading(); else loadingTpl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div>
        <div class="aspect-[4/3] rounded-xl bg-blue-100 dark:bg-slate-900 overflow-hidden shadow-brand">
          <img *ngIf="(selectedImage()||product()?.imageUrl) as img" [src]="img" alt="" class="w-full h-full object-cover"/>
        </div>
        <div class="mt-3 flex gap-2" *ngIf="product()?.images?.length">
          <button *ngFor="let i of product()?.images" (click)="selectedImage.set(i)" class="rounded-lg overflow-hidden border border-blue-900/20 dark:border-slate-700 focus:ring-2 focus:ring-amber-400">
            <img [src]="i" alt="" class="w-16 h-16 object-cover"/>
          </button>
        </div>
      </div>
      <div>
        <div class="text-sm text-slate-600 dark:text-slate-400 mb-2">
          <a [routerLink]="['/shop', product()?.shopSlug]" class="rounded-full px-2 py-0.5 border border-blue-900/25 dark:border-slate-700 bg-blue-50 dark:bg-slate-900/60">{{ product()?.shopName }}</a>
        </div>
        <h1 class="text-2xl font-bold text-blue-900 dark:text-white">{{ product()?.title }}</h1>
        <p class="mt-2 text-slate-700 dark:text-slate-200">{{ product()?.summary }}</p>
        <div class="mt-4 text-xl font-semibold text-blue-900 dark:text-white">{{ (displayPriceCents()/100) | number:'1.2-2' }} {{ product()?.currency }}</div>
        <div class="mt-3" *ngIf="product()?.variants?.length">
          <label class="block text-sm mb-1">Variant</label>
          <select class="h-10 rounded-full border px-3" [ngModel]="selectedVariantId()" (ngModelChange)="selectedVariantId.set($event)">
            <option *ngFor="let v of product()?.variants" [value]="v.id">{{ v.title }}</option>
          </select>
        </div>
        <div class="mt-4 flex items-center gap-3">
          <label class="text-sm">Qty</label>
          <input type="number" min="1" class="w-20 rounded-full border px-3 h-10" [ngModel]="quantity()" (ngModelChange)="quantity.set(Math.max(1, +$event||1))" />
          <button class="btn btn-primary" [disabled]="product()?.stock===0" (click)="addToCart()">Add to cart</button>
        </div>
        <div class="mt-4 text-xs text-slate-500" *ngIf="product()?.stock===0">Out of stock</div>
        <div class="mt-8 prose prose-sm dark:prose-invert max-w-none" *ngIf="product()?.description" [innerHTML]="product()?.description"></div>
      </div>
    </div>

    <section class="mt-12">
      <h2 class="text-lg font-semibold text-blue-900 dark:text-white mb-4">Related products</h2>
      <div class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-6">
        <a *ngFor="let p of related()" [routerLink]="['/product', p.uuid]" class="rounded-xl border border-blue-900/20 dark:border-slate-800 bg-white/80 dark:bg-slate-950/70 p-3 hover:shadow-brand transition">
          <div class="aspect-4/3 rounded-lg bg-blue-100 dark:bg-slate-900 overflow-hidden mb-3">
            <img *ngIf="p.imageUrl" [src]="p.imageUrl" alt="" class="w-full h-full object-cover"/>
          </div>
          <div class="text-sm font-medium text-blue-900 dark:text-white truncate">{{ p.title }}</div>
          <div class="text-xs text-slate-700 dark:text-slate-200">{{ (p.priceCents/100) | number:'1.2-2' }} {{ p.currency }}</div>
        </a>
      </div>
    </section>
  </ng-container>
  <ng-template #loadingTpl>
    <div class="text-slate-600 dark:text-slate-400">Loading product…</div>
  </ng-template>
</div>
