<div class="py-4 space-y-6 max-w-2xl">
  <h1 class="text-xl font-semibold text-blue-900 dark:text-white">Checkout</h1>
  <p class="text-sm text-slate-600 dark:text-slate-300">Configure customer checkout experience and requirements.</p>

  @if (error()) {
    <p class="text-sm text-red-500">{{ error() }}</p>
  }
  @if (saved()) {
    <p class="text-sm text-green-600 dark:text-green-400">Checkout settings saved.</p>
  }

  @if (loading()) {
    <div class="space-y-4">
      @for (i of [1,2,3]; track i) {
        <div class="h-12 animate-pulse rounded-lg bg-slate-200 dark:bg-slate-800"></div>
      }
    </div>
  } @else {
    <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-4 space-y-4">
      <h2 class="text-sm font-semibold text-blue-900 dark:text-white">Checkout options</h2>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="guestCheckout()" (change)="guestCheckout.set(!guestCheckout())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Allow guest checkout</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Customers can checkout without creating an account.</p>
        </div>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="requireEmail()" (change)="requireEmail.set(!requireEmail())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Require email address</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Email is required for order confirmation and updates.</p>
        </div>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="requirePhone()" (change)="requirePhone.set(!requirePhone())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Require phone number</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Phone number is required at checkout.</p>
        </div>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="orderNotes()" (change)="orderNotes.set(!orderNotes())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Enable order notes</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Allow customers to add notes to their orders.</p>
        </div>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="termsAcceptance()" (change)="termsAcceptance.set(!termsAcceptance())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Require terms acceptance</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Customers must accept terms of service before completing checkout.</p>
        </div>
      </label>
    </div>

    <button type="button" (click)="save()" [disabled]="saving()"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-500 disabled:opacity-50 transition">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
  }
</div>
