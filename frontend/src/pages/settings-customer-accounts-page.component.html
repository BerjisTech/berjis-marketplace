<div class="py-4 space-y-6 max-w-2xl">
  <h1 class="text-xl font-semibold text-blue-900 dark:text-white">Customer accounts</h1>
  <p class="text-sm text-slate-600 dark:text-slate-300">Configure customer login and account creation settings.</p>

  @if (error()) {
    <p class="text-sm text-red-500">{{ error() }}</p>
  }
  @if (saved()) {
    <p class="text-sm text-green-600 dark:text-green-400">Customer account settings saved.</p>
  }

  @if (loading()) {
    <div class="space-y-4">
      @for (i of [1,2,3]; track i) {
        <div class="h-12 animate-pulse rounded-lg bg-slate-200 dark:bg-slate-800"></div>
      }
    </div>
  } @else {
    <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-4 space-y-4">
      <h2 class="text-sm font-semibold text-blue-900 dark:text-white">Account settings</h2>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="loginRequired()" (change)="loginRequired.set(!loginRequired())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Require customer login</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Customers must create an account to browse or purchase.</p>
        </div>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" [checked]="socialLogin()" (change)="socialLogin.set(!socialLogin())"
          class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Enable social login</span>
          <p class="text-xs text-slate-500 dark:text-slate-400">Allow customers to sign in with Google, Facebook, etc.</p>
        </div>
      </label>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Minimum password length</label>
        <input type="number" [(ngModel)]="minPasswordLength" name="minPasswordLength" min="6" max="32"
          class="w-32 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 text-sm text-slate-900 dark:text-white focus:border-blue-500 focus:outline-none">
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Minimum 6 characters recommended.</p>
      </div>
    </div>

    <button type="button" (click)="save()" [disabled]="saving()"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-500 disabled:opacity-50 transition">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
  }
</div>
