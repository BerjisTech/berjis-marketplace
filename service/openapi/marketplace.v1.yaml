openapi: 3.0.3
info:
  title: Berjis Marketplace API
  version: 0.1.0
servers:
  - url: /
paths:
  /v1/health:
    get:
      summary: Health
      responses:
        '200': { description: ok }
  /v1/products:
    get:
      summary: List published products across shops
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: string }
        - in: query
          name: maxPrice
          schema: { type: string }
        - in: query
          name: collection
          schema: { type: string }
        - in: query
          name: shop
          schema: { type: string }
      responses:
        '200': { description: ok }
  /v1/products/{id}:
    get:
      summary: Get product by UUID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /v1/shops:
    get:
      summary: List shops
      responses:
        '200': { description: ok }
    post:
      summary: Create shop (auth required)
      responses:
        '200': { description: ok }
  /v1/shops/{slug}:
    get:
      summary: Get shop by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /v1/shops/{slug}/products:
    get:
      summary: List products for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /v1/shops/{slug}/collections:
    get:
      summary: List public collections for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /v1/my/shops/{slug}/inventory/{id}/history:
    get:
      summary: List inventory adjustments for a level
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /v1/my/shops/{slug}/inventory/{id}/adjustments:
    post:
      summary: Create an inventory adjustment
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deltaQuantity: { type: integer }
                deltaReserved: { type: integer }
                reason: { type: string }
                note: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid request }
        '404': { description: not found }
  /v1/my/shops/{slug}/inventory/alerts:
    get:
      summary: List inventory alerts
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [open, resolved, all]
      responses:
        '200': { description: ok }
  /v1/my/shops/{slug}/inventory/alerts/{id}/resolve:
    post:
      summary: Resolve a low stock alert
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /v1/my/shops/{slug}/inventory/locations:
    get:
      summary: List inventory locations for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
    post:
      summary: Create a new inventory location
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
                isPrimary: { type: boolean }
      responses:
        '200': { description: ok }
        '409': { description: conflict }
  /v1/my/shops/{slug}/inventory/locations/{id}:
    patch:
      summary: Update an inventory location
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
                isPrimary: { type: boolean }
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /v1/my/shops/{slug}/suppliers:
    get:
      summary: List suppliers for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
    post:
      summary: Create a supplier
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                contactEmail: { type: string }
                phone: { type: string }
                notes: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: conflict }
  /v1/my/shops/{slug}/purchase-orders:
    get:
      summary: List purchase orders for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200': { description: ok }
    post:
      summary: Create a purchase order
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplierUuid: { type: string }
                supplierName: { type: string }
                contactEmail: { type: string }
                phone: { type: string }
                expectedAt: { type: string, format: date-time }
                notes: { type: string }
                status: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productUuid: { type: string }
                      quantity: { type: integer }
                      costCents: { type: integer }
      responses:
        '200': { description: ok }
  /v1/my/shops/{slug}/purchase-orders/{id}/receive:
    post:
      summary: Record received items for a purchase order
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locationUuid: { type: string }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productUuid: { type: string }
                      quantity: { type: integer }
      responses:
        '200': { description: ok }
        '400': { description: invalid request }
  /v1/my/shops/{slug}/transfers:
    get:
      summary: List transfers for a shop
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
    post:
      summary: Create an inventory transfer
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceLocationUuid: { type: string }
                destinationLocationUuid: { type: string }
                notes: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productUuid: { type: string }
                      quantity: { type: integer }
      responses:
        '200': { description: ok }
        '400': { description: invalid request }
  /v1/my/shops/{slug}/transfers/{id}/commit:
    post:
      summary: Commit a transfer and adjust inventory
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid request }
        '404': { description: not found }
  /v1/my/shops/{slug}/collections/{id}/rebuild:
    post:
      summary: Rebuild an automatic collection
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: bad request }
        '404': { description: not found }
  /v1/my/shops/{slug}/collections/{id}/products:
    get:
      summary: List products in a collection
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /v1/cart/preview:
    post:
      summary: Preview cart totals with discount or gift card applied
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discountCode: { type: string }
                giftCardCode: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: bad request }
  /v1/orders:
    get:
      summary: List customer orders
      responses:
        '200': { description: ok }
    post:
      summary: Create an order from the cart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discountCode: { type: string }
                giftCardCode: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: bad request }
  /v1/my/shops/{slug}/discounts/report:
    get:
      summary: Discount redemption report
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '403': { description: forbidden }
        '404': { description: not found }
  /v1/my/shops/{slug}/gift-cards/report:
    get:
      summary: Gift card balance report
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '403': { description: forbidden }
        '404': { description: not found }
